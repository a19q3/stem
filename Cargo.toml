[package]
name = "stem"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "Stem, a CKB-native sidechain"
repository = "https://github.com/a19q3/stem"
publish = false

[features]
default = [
    "native-cell-subtree-parallel",
    "native-candidate-cell-prefetch",
    "jolteon-cross-block-pipeline",
]
comet-benchmark = []
jolteon-certificate-experiment = []
jolteon-shared-certificate-path = []
jolteon-retain-verified-quorums = ["jolteon-shared-certificate-path", "dep:lru"]
jolteon-admission-pipeline = []
jolteon-candidate-pipeline = []
jolteon-commit-pipeline = ["jolteon-candidate-pipeline"]
jolteon-resident-node-publication = ["jolteon-commit-pipeline"]
jolteon-prebuilt-state-write = ["jolteon-commit-pipeline"]
jolteon-reuse-write-buffer = ["jolteon-commit-pipeline"]
jolteon-proposal-pipeline = []
jolteon-share-proposal-bytes = []
jolteon-shared-proposal-snapshot = ["jolteon-proposal-pipeline", "dep:imbl"]
jolteon-cross-block-pipeline = ["jolteon-commit-pipeline", "jolteon-proposal-pipeline"]
jolteon-exact-prefix-pipeline = ["jolteon-cross-block-pipeline"]
jolteon-cancel-stale-execution = ["jolteon-candidate-pipeline", "jolteon-proposal-pipeline"]
jolteon-pre-quorum-proposal = ["jolteon-exact-prefix-pipeline", "jolteon-cancel-stale-execution"]
jolteon-bounded-cycle-scan = []
jolteon-aged-proposal-selection = []
native-commitment-pipeline = []
native-cell-subtree-parallel = ["stem-ledger/parallel-patricia"]
native-verified-cell-nodes = ["stem-ledger/verified-patricia-cache"]
native-verified-cell-journal = ["native-verified-cell-nodes"]
native-compact-patricia-journal = ["native-verified-cell-journal", "stem-ledger/compact-verified-journal"]
native-segmented-patricia-journal = ["native-compact-patricia-journal", "stem-ledger/segmented-verified-journal"]
native-stream-node-publication = ["native-verified-cell-journal"]
native-compact-write-journal = []
native-prepared-cell-record-keys = []
native-vectored-cell-writes = []
native-candidate-cell-prefetch = []
native-shared-pinned-cell-cache = ["jolteon-cross-block-pipeline"]
native-sharded-live-cache = []
native-live-cell-parent-index = []
native-inline-outpoint-index = []
native-lineage-ready-prefix = []
native-reuse-lineage-cell-reads = []
native-lineage-dependency-lookahead = []
native-rolling-lineage-execution = ["native-lineage-dependency-lookahead"]
native-leader-lineage-execution = ["native-rolling-lineage-execution"]
native-keeper-parallel-preparation = []
native-reuse-keeper-proposal-prefix = []
native-work-stealing = []
native-rolling-script-groups = ["stem-vm/rolling-script-groups"]
native-trace-cycle-reuse = ["stem-vm/trace-cycle-reuse"]
native-dependency-execution = []
native-inline-cell-resolution = ["stem-ledger/inline-cell-resolution"]
native-shared-cell-deps = []
native-leader-dependency-execution = []
native-reuse-parent-spend-rejections = ["native-leader-dependency-execution"]
native-rolling-cell-execution = ["native-dependency-execution"]
native-rolling-leader-execution = ["native-leader-dependency-execution"]
native-mask-rejected-cell-projections = ["native-rolling-leader-execution", "native-incremental-cell-projection"]
native-reuse-ordered-cell-writes = []
native-incremental-cell-projection = []
native-reclaim-cell-projection = ["native-incremental-cell-projection", "native-reuse-ordered-cell-writes"]
native-execution-material-cache = ["stem-ledger/execution-material-cache"]
native-compact-cell-trial-edits = ["dep:smallvec"]
native-research-jmt = ["dep:borsh", "dep:jmt"]
native-jmt-observed-retirement = ["native-research-jmt"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
borsh = { version = "=1.6.1", optional = true }
bytes.workspace = true
ckb-crypto.workspace = true
ckb-db.workspace = true
ckb-hash.workspace = true
ckb-jsonrpc-types.workspace = true
stem-bridge-wire = { path = "bridge-wire" }
stem-ledger = { path = "ledger" }
stem-stake = { path = "stake", default-features = false, features = ["ckb-settlement"] }
stem-vm = { path = "vm" }
ckb-types.workspace = true
ed25519-dalek.workspace = true
clap = { workspace = true, features = ["derive"] }
hex.workspace = true
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
imbl = { version = "7.0.2", optional = true }
jmt = { version = "=0.12.0", optional = true, default-features = false, features = ["sha2", "std"] }
lru = { workspace = true, optional = true }
prost = "0.13"
rand.workspace = true
rayon.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
smallvec = { version = "1.15", optional = true }
tendermint-proto = "=0.40.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
blst = { version = "=0.3.17", features = ["no-threads"] }
ckb-chain-spec.workspace = true
ckb-script = { workspace = true, features = ["asm"] }
ckb-traits.workspace = true
ckb-vm = { workspace = true, features = ["asm"] }

[workspace]
members = ["bridge-wire", "intent", "ledger", "sdk/wasm", "stake", "vm", "vendor/ckb-script"]
default-members = ["."]
exclude = ["contracts", "vendor/ckb-script/fuzz", "vendor/ckb-vm", "vendor/ckb-vm/definitions", "vendor/ckb-vm/fuzz"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.34"
base64 = "0.21.0"
byteorder = "1.3.1"
bytes = "1.11.1"
ckb-chain-spec = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-crypto = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-db = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-db-schema = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-error = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-hash = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3", default-features = false }
ckb-jsonrpc-types = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-logger = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-resource = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-script = { path = "vendor/ckb-script", default-features = false }
ckb-store = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-test-chain-utils = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-traits = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-types = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-verification = { git = "https://github.com/nervosnetwork/ckb", rev = "119598b0a1146a569068ac80bdba7eb5f6292fd3" }
ckb-vm = { path = "vendor/ckb-vm", version = "=0.24.15", default-features = false }
clap = "=4.4"
daggy = "0.8.0"
ed25519-dalek = "2.1"
faster-hex = { version = "2.0", default-features = false, features = ["std"] }
hex = "0.4"
lru = "0.7.1"
molecule = { version = "0.9.0", default-features = false }
proptest = "1.0"
rand = "0.8.5"
rayon = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tiny-keccak = "2.0"
tokio = "1.35.0"

[patch.crates-io]
ckb-vm = { path = "vendor/ckb-vm" }

[patch."https://github.com/nervosnetwork/ckb"]
ckb-script = { path = "vendor/ckb-script" }

[profile.release]
overflow-checks = true

[profile.release.build-override]
opt-level = 3

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
