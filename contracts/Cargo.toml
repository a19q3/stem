[workspace]

[package]
name = "stem-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[features]
# Disable the default only when rebuilding the frozen CometBFT comparison.
default = ["jolteon"]
jolteon = ["stem-stake/ckb-settlement"]

[[bin]]
name = "jolteon-checkpoint"
path = "src/bin/jolteon-checkpoint.rs"
required-features = ["jolteon"]

[[bin]]
name = "intercell-mailbox"
path = "src/bin/intercell-mailbox.rs"
required-features = ["jolteon"]

[[bin]]
name = "checkpoint-fee-fund"
path = "src/bin/checkpoint-fee-fund.rs"
required-features = ["jolteon"]

[dependencies]
ckb-hash = { version = "=1.1.1", default-features = false, features = ["ckb-contract"] }
stem-bridge-wire = { path = "../bridge-wire" }
stem-stake = { path = "../stake", default-features = false }
stem-intent = { path = "../intent" }
ed25519-dalek = { version = "2.1", default-features = false }
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "calc-hash", "type-id"] }

[dev-dependencies]
bls12_381 = { version = "=0.8.0", default-features = false, features = ["alloc", "experimental", "pairings"] }
sha2 = { version = "=0.9.9", default-features = false }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true
panic = "abort"
strip = true
