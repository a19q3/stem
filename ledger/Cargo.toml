[package]
name = "stem-ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[features]
parallel-patricia = ["dep:rayon"]
batched-patricia-proofs = []
patricia-frontier-edit = ["parallel-patricia", "verified-patricia-cache"]
verified-patricia-cache = ["dep:hashbrown"]
compact-verified-journal = ["verified-patricia-cache"]
segmented-verified-journal = ["compact-verified-journal"]
execution-material-cache = []
inline-cell-resolution = []
lazy-cell-digests = []

[dependencies]
anyhow.workspace = true
ckb-hash.workspace = true
ckb-types.workspace = true
hashbrown = { version = "0.17", optional = true, default-features = false, features = ["inline-more"] }
lru.workspace = true
rayon = { workspace = true, optional = true }
stem-stake = { path = "../stake", default-features = false }
stem-bridge-wire = { path = "../bridge-wire" }
stem-intent = { path = "../intent" }

[build-dependencies]
molecule-codegen = "=0.9.2"

[dev-dependencies]
ed25519-dalek.workspace = true
molecule.workspace = true
tempfile.workspace = true
