[package]
name = "stem-vm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[dependencies]
anyhow.workspace = true
ckb-script = { workspace = true, default-features = false, features = ["detect-asm", "vm-reuse"] }
ckb-types.workspace = true
ckb-vm.workspace = true
stem-ledger = { path = "../ledger" }
lru.workspace = true
rayon.workspace = true
secp256k1 = { version = "=0.30.0", features = ["recovery"] }

[dev-dependencies]
ckb-crypto.workspace = true
ckb-hash.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
tempfile.workspace = true
